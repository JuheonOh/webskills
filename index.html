<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Juheon Oh | WebSkills Archive</title>
    <style>
      :root {
        --primary-color: #2563eb; /* 깔끔한 블루 */
        --bg-color: #f8fafc;
        --card-bg: #ffffff;
        --text-main: #1e293b;
        --text-muted: #64748b;
      }

      body {
        font-family:
          "Pretendard",
          -apple-system,
          BlinkMacSystemFont,
          system-ui,
          Roboto,
          sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        padding: 40px 20px;
      }

      header {
        text-align: center;
        margin-bottom: 50px;
      }

      header h1 {
        font-size: 2.5rem;
        margin-bottom: 10px;
        letter-spacing: -0.02em;
      }

      header p {
        color: var(--text-muted);
        font-size: 1.1rem;
      }

      .container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 25px;
        width: 100%;
        max-width: 1000px;
      }

      .card {
        background: var(--card-bg);
        border-radius: 16px;
        padding: 30px;
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        transition: all 0.3s ease;
        text-decoration: none;
        color: inherit;
        display: flex;
        flex-direction: column;
        border: 1px solid #e2e8f0;
      }

      .card:hover {
        transform: translateY(-8px);
        box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1);
        border-color: var(--primary-color);
      }

      .card .tag {
        display: inline-block;
        background: #eff6ff;
        color: var(--primary-color);
        font-weight: 600;
        font-size: 0.8rem;
        padding: 4px 12px;
        border-radius: 99px;
        margin-bottom: 15px;
        width: fit-content;
        text-transform: uppercase;
      }

      .card h2 {
        font-size: 1.4rem;
        margin: 0 0 10px 0;
      }

      .card p {
        color: var(--text-muted);
        margin: 0;
        font-size: 0.95rem;
        flex-grow: 1;
      }

      .card .view-project {
        margin-top: 25px;
        font-weight: 600;
        color: var(--primary-color);
        display: flex;
        align-items: center;
        gap: 5px;
      }

      footer {
        margin-top: auto;
        padding-top: 60px;
        color: var(--text-muted);
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>WebSkills Archive</h1>
      <p>기능경기대회 웹 디자인 및 개발 프로젝트 기록</p>
    </header>

    <div class="container">
      <a href="./2017-national/index.html" class="card">
        <span class="tag">National</span>
        <h2>제52회 전국기능경기대회</h2>
        <p>2과제: Website Layout 설계 및 구현</p>
        <div class="view-project">결과물 보기 &rarr;</div>
      </a>

      <a href="./2017-local/index.html" class="card">
        <span class="tag">Local</span>
        <h2>광주광역시 지방기능경기대회</h2>
        <p>2과제: Website Layout 설계 및 구현</p>
        <div class="view-project">결과물 보기 &rarr;</div>
      </a>

      <a href="./2016-national/index.html" class="card">
        <span class="tag">National</span>
        <h2>제51회 전국기능경기대회</h2>
        <p>2과제: Website Layout 설계 및 구현</p>
        <div class="view-project">결과물 보기 &rarr;</div>
      </a>
    </div>

    <footer>
      <p>&copy; 2026 Juheon Oh. Built with Passion.</p>
    </footer>
  </body>
</html>
